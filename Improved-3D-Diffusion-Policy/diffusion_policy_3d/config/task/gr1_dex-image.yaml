name: box

shape_meta: &shape_meta #可以在其它地方引用这整个层级参数，包括obs和action，而不只是一个参数
  # acceptable types: rgb, low_dim
  obs:
    image:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${n_obs_steps}
    agent_pos:
      shape: [6]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [15]
    horizon: ${n_action_steps}


dataset:
  _target_: diffusion_policy_3d.dataset.gr1_dex_dataset_image.GR1DexDatasetImage
  zarr_path: data/box_zarr
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.00
  max_train_episodes: 90
  use_act_normal: False
  use_img: true
  use_depth: false
  use_relative_action: true